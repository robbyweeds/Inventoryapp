name: Verify deployment
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Package tracked source only
        run: git archive --format=tar.gz --prefix=Inventoryapp/ HEAD -o inventoryapp.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: inventoryapp-source
          path: inventoryapp.tar.gz
